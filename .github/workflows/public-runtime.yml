name: Public runtime offline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the controlled PTY shell and activity probe
        run: sudo apt-get update && sudo apt-get install --yes zsh lsof
      - name: Exact public inventory, imports, links, tests, policy and demo
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          UV_OFFLINE: '1'
          UV_PYTHON_DOWNLOADS: never
          PIP_NO_INDEX: '1'
        run: TMPDIR="$RUNNER_TEMP" python -B scripts/check_public_distribution.py
